# Netlify Configuration File for Optimal Caching
# Place this file in the root directory of your project

[build]
  # Build command and publish directory
  command = "npm run build"
  publish = "build"
  
# Function settings for optimal performance
[functions]
  # Reduce cold start times
  node_bundler = "esbuild"

# Cache-Control Headers for Maximum Performance
[[headers]]
  # Apply to all routes with resource hints and security
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    # Performance hints - DNS prefetch for external resources
    Link = '''
    <https://fonts.googleapis.com>; rel=dns-prefetch,
    <https://cdnjs.cloudflare.com>; rel=dns-prefetch,
    <https://fonts.gstatic.com>; rel=dns-prefetch,
    <https://worldsbestcables.com>; rel=dns-prefetch
    '''

[[headers]]
  # Cache static assets aggressively (images, fonts, etc.)
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    # 1 year cache for static assets with immutable flag

[[headers]]
  # Cache assets folder (covers all subdirectories)
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Cache images in any subdirectory
  for = "/**/*.gif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/gif"

[[headers]]
  # Cache all GIF images for 1 year (root level)
  for = "/*.gif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/gif"

[[headers]]
  # Cache PNG images in any subdirectory
  for = "/**/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/png"

[[headers]]
  # Cache all PNG images for 1 year (root level)
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/png"

[[headers]]
  # Cache JPG images in any subdirectory
  for = "/**/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/jpeg"

[[headers]]
  # Cache all JPG/JPEG images for 1 year (root level)
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/jpeg"

[[headers]]
  # Cache JPEG images in any subdirectory
  for = "/**/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/jpeg"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/jpeg"

[[headers]]
  # Cache SVG images in any subdirectory
  for = "/**/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/svg+xml"

[[headers]]
  # Cache all SVG images for 1 year (root level)
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/svg+xml"

[[headers]]
  # Cache WebP images in any subdirectory
  for = "/**/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/webp"

[[headers]]
  # Cache WebP images for 1 year (root level)
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/webp"

[[headers]]
  # Cache JavaScript bundles for 1 year
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/javascript"

[[headers]]
  # Cache CSS files for 1 year
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "text/css"

[[headers]]
  # Cache fonts for 1 year
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "font/woff2"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "font/woff"

[[headers]]
  for = "/*.ttf"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "font/ttf"

[[headers]]
  # HTML files - shorter cache with revalidation
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  # Index/root - no cache to ensure latest version
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  # Service worker - no cache
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  # Manifest files - moderate cache
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Asset optimization settings
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# Brotli compression for better performance
[[headers]]
  for = "*.js"
  [headers.values]
    Content-Encoding = "br"

[[headers]]
  for = "*.css"
  [headers.values]
    Content-Encoding = "br"

# Plugin for image optimization (optional but recommended)
[[plugins]]
  package = "@netlify/plugin-lighthouse"

# Redirect rules (if needed)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Environment variables for build optimization
[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"
  GENERATE_SOURCEMAP = "false"
  # Disable source maps for production
  # React optimizations
  INLINE_RUNTIME_CHUNK = "false"
  IMAGE_INLINE_SIZE_LIMIT = "0"
  # Prevent inlining to leverage browser caching

# Deploy previews configuration
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# Production context
[context.production]
  command = "npm run build"
  [context.production.environment]
    NODE_ENV = "production"